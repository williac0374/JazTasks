<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>JazTasks</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
        :root {
            --text-color: #1f2937;
            --bg-color: #f5f2ef;
            --panel-color: rgba(255, 255, 255, 0.65);
            --button-color: #4f46e5;
            --button-text: #ffffff;
            --danger-color: #dc2626;
            --shadow: rgba(15, 23, 42, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            background-image: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .app-shell {
            width: min(100%, 900px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 18px 16px 14px;
        }

        .task-panel {
            flex: 1;
            overflow-y: auto;
            padding: 8px 4px 12px;
        }

        .task-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 14px;
            background: var(--panel-color);
            box-shadow: 0 8px 20px var(--shadow);
            backdrop-filter: blur(6px);
        }

        .task-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: var(--button-color);
            flex-shrink: 0;
        }

        .task-text {
            flex: 1;
            width: 100%;
            border: none;
            background: transparent;
            color: inherit;
            font: inherit;
            padding: 6px 0;
            outline: none;
            min-width: 0;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            opacity: 0.7;
        }

        .delete-task {
            border: none;
            background: rgba(220, 38, 38, 0.12);
            color: var(--danger-color);
            border-radius: 10px;
            padding: 6px 10px;
            font: inherit;
            cursor: pointer;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 8px 8px 10px;
        }

        .toolbar button,
        .modal-actions button,
        .settings-button,
        .danger-button,
        .secondary-button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .toolbar button:active,
        .modal-actions button:active,
        .settings-button:active,
        .danger-button:active,
        .secondary-button:active {
            transform: translateY(1px);
        }

        .new-task-btn,
        .save-btn {
            background: var(--button-color);
            color: var(--button-text);
        }

        .settings-btn,
        .secondary-button,
        .close-btn {
            background: rgba(255, 255, 255, 0.7);
            color: var(--text-color);
        }

        .danger-button {
            background: rgba(220, 38, 38, 0.12);
            color: var(--danger-color);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.52);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            position: relative;
            width: min(100%, 500px);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.3);
            padding: 24px 20px 18px;
        }

        .modal-content h2 {
            margin: 0 0 16px;
            font-size: clamp(1.5rem, 3vw, 2rem);
        }

        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-weight: 600;
        }

        .field input,
        .field select {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.7);
            border-radius: 10px;
            background: #fff;
            padding: 10px 12px;
            font: inherit;
            color: inherit;
        }

        .field input[type="color"] {
            height: 52px;
            padding: 6px;
        }

        .field input[type="range"] {
            padding: 0;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
        }

        .modal-actions button {
            flex: 1;
        }

        @media (max-width: 520px) {
            .app-shell {
                padding-left: 10px;
                padding-right: 10px;
            }

            .toolbar {
                gap: 10px;
            }

            .toolbar button {
                flex: 1;
                padding-left: 10px;
                padding-right: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <main class="task-panel">
            <ul id="taskList" class="task-list" aria-live="polite"></ul>
        </main>

        <div class="toolbar" aria-label="Task actions">
            <button id="newTaskBtn" class="new-task-btn" type="button">New Task</button>
            <button id="settingsBtn" class="settings-btn" type="button">Settings</button>
        </div>
    </div>

    <div id="settingsModal" class="modal hidden" aria-modal="true" role="dialog" aria-labelledby="settingsTitle">
        <div class="modal-content">
            <button type="button" id="closeSettingsXBtn" class="close-btn" aria-label="Close settings"
                style="position:absolute; top:18px; right:18px; padding:8px 12px;">×</button>
            <h2 id="settingsTitle">App Settings</h2>

            <form id="settingsForm" class="settings-form">
                <div class="field">
                    <label for="fontFamily">Font</label>
                    <select id="fontFamily">
                        <option value="Segoe UI, sans-serif">Segoe UI</option>
                        <option value="Arial, sans-serif">Arial</option>
                        <option value="Verdana, sans-serif">Verdana</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="Tahoma, sans-serif">Tahoma</option>
                        <option value="Trebuchet MS, sans-serif">Trebuchet MS</option>
                    </select>
                </div>

                <div class="field">
                    <label for="fontSize">Text Size</label>
                    <input id="fontSize" type="range" min="12" max="28" step="1" />
                </div>

                <div class="field">
                    <label for="textColor">Text Color</label>
                    <input id="textColor" type="color" />
                </div>

                <div class="field">
                    <label for="backgroundColor">Background Color</label>
                    <input id="backgroundColor" type="color" />
                </div>

                <div class="field">
                    <label for="taskCardBackground">Task Background Color</label>
                    <input id="taskCardBackground" type="color" />
                </div>

                <div class="field">
                    <label for="taskCardOpacity">Task Background Transparency</label>
                    <input id="taskCardOpacity" type="range" min="0" max="100" step="1" />
                </div>

                <div class="field">
                    <label for="backgroundImage">Background Image</label>
                    <input id="backgroundImage" type="file" accept="image/*" />
                </div>

                <button id="removeBackgroundImage" class="secondary-button" type="button">Remove Background
                    Image</button>
                <button id="clearTaskListBtn" class="danger-button" type="button">Clear Task List</button>

                <div class="modal-actions">
                    <button type="submit" class="save-btn">Save Changes</button>
                    <button type="button" id="closeSettingsBtn" class="close-btn">Close</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const STORAGE_KEYS = {
            tasks: 'jaztasks.tasks',
            settings: 'jaztasks.settings'
        };

        const defaultSettings = {
            fontFamily: 'Segoe UI, sans-serif',
            fontSize: 18,
            textColor: '#1f2937',
            backgroundColor: '#f5f2ef',
            taskCardBackground: '#ffffff',
            taskCardOpacity: 65,
            backgroundImage: ''
        };

        const taskList = document.getElementById('taskList');
        const newTaskBtn = document.getElementById('newTaskBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const settingsForm = document.getElementById('settingsForm');
        const fontFamilyInput = document.getElementById('fontFamily');
        const fontSizeInput = document.getElementById('fontSize');
        const textColorInput = document.getElementById('textColor');
        const backgroundColorInput = document.getElementById('backgroundColor');
        const taskCardBackgroundInput = document.getElementById('taskCardBackground');
        const taskCardOpacityInput = document.getElementById('taskCardOpacity');
        const backgroundImageInput = document.getElementById('backgroundImage');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const closeSettingsXBtn = document.getElementById('closeSettingsXBtn');
        const clearTaskListBtn = document.getElementById('clearTaskListBtn');
        const removeBackgroundImageBtn = document.getElementById('removeBackgroundImage');

        let tasks = loadTasks();
        let settings = loadSettings();

        function loadTasks() {
            try {
                const stored = JSON.parse(localStorage.getItem(STORAGE_KEYS.tasks));
                return Array.isArray(stored) ? stored : [];
            } catch (error) {
                return [];
            }
        }

        function saveTasks() {
            localStorage.setItem(STORAGE_KEYS.tasks, JSON.stringify(tasks));
        }

        function loadSettings() {
            try {
                const stored = JSON.parse(localStorage.getItem(STORAGE_KEYS.settings));
                return { ...defaultSettings, ...(stored || {}) };
            } catch (error) {
                return { ...defaultSettings };
            }
        }

        function saveSettings() {
            localStorage.setItem(STORAGE_KEYS.settings, JSON.stringify(settings));
        }

        function hexToRgba(hex, opacityPercent) {
            const safeHex = (hex || '#ffffff').replace('#', '');
            const normalized = safeHex.length === 3
                ? safeHex.split('').map((char) => char + char).join('')
                : safeHex;

            const red = Number.parseInt(normalized.slice(0, 2), 16);
            const green = Number.parseInt(normalized.slice(2, 4), 16);
            const blue = Number.parseInt(normalized.slice(4, 6), 16);
            const opacity = Number(opacityPercent) / 100;

            return `rgba(${red}, ${green}, ${blue}, ${opacity})`;
        }

        function applyTaskCardStyles() {
            const taskCards = document.querySelectorAll('.task-item');
            taskCards.forEach((card) => {
                const opacity = Number(settings.taskCardOpacity ?? 65);
                if (opacity <= 0) {
                    card.style.background = 'transparent';
                    card.style.boxShadow = 'none';
                    card.style.backdropFilter = 'none';
                    return;
                }

                card.style.background = hexToRgba(settings.taskCardBackground || '#ffffff', opacity);
                card.style.boxShadow = '0 8px 20px rgba(15, 23, 42, 0.15)';
                card.style.backdropFilter = 'blur(6px)';
            });
        }

        function applySettings() {
            document.body.style.fontFamily = settings.fontFamily;
            document.body.style.fontSize = `${settings.fontSize}px`;
            document.body.style.color = settings.textColor;
            document.body.style.backgroundColor = settings.backgroundColor;

            if (settings.backgroundImage) {
                document.body.style.backgroundImage = `url("${settings.backgroundImage}")`;
            } else {
                document.body.style.backgroundImage = 'none';
            }

            applyTaskCardStyles();
        }

        function populateSettingsFields() {
            fontFamilyInput.value = settings.fontFamily;
            fontSizeInput.value = String(settings.fontSize);
            textColorInput.value = settings.textColor;
            backgroundColorInput.value = settings.backgroundColor;
            taskCardBackgroundInput.value = settings.taskCardBackground;
            taskCardOpacityInput.value = String(settings.taskCardOpacity ?? 65);
        }

        function renderTasks() {
            taskList.innerHTML = '';

            tasks.forEach((task) => {
                const taskItem = document.createElement('li');
                taskItem.className = `task-item ${task.checked ? 'completed' : ''}`;

                const opacity = Number(settings.taskCardOpacity ?? 65);
                if (opacity <= 0) {
                    taskItem.style.background = 'transparent';
                    taskItem.style.boxShadow = 'none';
                    taskItem.style.backdropFilter = 'none';
                } else {
                    taskItem.style.background = hexToRgba(settings.taskCardBackground || '#ffffff', opacity);
                    taskItem.style.boxShadow = '0 8px 20px rgba(15, 23, 42, 0.15)';
                    taskItem.style.backdropFilter = 'blur(6px)';
                }

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = Boolean(task.checked);
                checkbox.setAttribute('aria-label', 'Mark task complete');
                checkbox.addEventListener('change', () => {
                    task.checked = checkbox.checked;
                    taskItem.classList.toggle('completed', task.checked);
                    saveTasks();
                });

                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.className = 'task-text';
                textInput.value = task.text;
                textInput.placeholder = 'Task name';
                textInput.setAttribute('aria-label', 'Task name');
                textInput.addEventListener('input', (event) => {
                    task.text = event.target.value;
                    saveTasks();
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'delete-task';
                deleteBtn.textContent = 'Delete';
                deleteBtn.setAttribute('aria-label', 'Delete task');
                deleteBtn.addEventListener('click', () => {
                    tasks = tasks.filter((item) => item.id !== task.id);
                    saveTasks();
                    renderTasks();
                });

                taskItem.appendChild(checkbox);
                taskItem.appendChild(textInput);
                taskItem.appendChild(deleteBtn);
                taskList.appendChild(taskItem);
            });
        }

        function addTask() {
            const newTask = {
                id: Date.now() + Math.random(),
                text: '',
                checked: false
            };

            tasks.push(newTask);
            saveTasks();
            renderTasks();

            const inputs = taskList.querySelectorAll('.task-text');
            if (inputs.length) {
                inputs[inputs.length - 1].focus();
            }
        }

        function openSettings() {
            populateSettingsFields();
            applyTaskCardStyles();
            settingsModal.classList.remove('hidden');
        }

        function closeSettings() {
            settingsModal.classList.add('hidden');
        }

        newTaskBtn.addEventListener('click', addTask);
        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        closeSettingsXBtn.addEventListener('click', closeSettings);

        taskCardBackgroundInput.addEventListener('input', () => {
            settings.taskCardBackground = taskCardBackgroundInput.value;
            saveSettings();
            applyTaskCardStyles();
            renderTasks();
        });

        taskCardOpacityInput.addEventListener('input', () => {
            const opacityValue = Number(taskCardOpacityInput.value);
            settings.taskCardOpacity = Number.isFinite(opacityValue) ? opacityValue : defaultSettings.taskCardOpacity;
            saveSettings();
            applyTaskCardStyles();
            renderTasks();
        });

        settingsModal.addEventListener('click', (event) => {
            if (event.target === settingsModal) {
                closeSettings();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !settingsModal.classList.contains('hidden')) {
                closeSettings();
            }
        });

        settingsForm.addEventListener('submit', (event) => {
            event.preventDefault();

            settings.fontFamily = fontFamilyInput.value;
            settings.fontSize = Number(fontSizeInput.value) || defaultSettings.fontSize;
            settings.textColor = textColorInput.value;
            settings.backgroundColor = backgroundColorInput.value;
            settings.taskCardBackground = taskCardBackgroundInput.value;

            const opacityValue = Number(taskCardOpacityInput.value);
            settings.taskCardOpacity = Number.isFinite(opacityValue) ? opacityValue : defaultSettings.taskCardOpacity;

            saveSettings();
            applySettings();
            renderTasks();
            closeSettings();
        });

        clearTaskListBtn.addEventListener('click', () => {
            tasks = [];
            settings = { ...defaultSettings };
            localStorage.clear();
            populateSettingsFields();
            applySettings();
            renderTasks();
            closeSettings();
        });

        removeBackgroundImageBtn.addEventListener('click', () => {
            settings.backgroundImage = '';
            backgroundImageInput.value = '';
            saveSettings();
            applySettings();
        });

        backgroundImageInput.addEventListener('change', (event) => {
            const file = event.target.files && event.target.files[0];
            if (!file) {
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                settings.backgroundImage = String(reader.result);
                saveSettings();
                applySettings();
            };
            reader.readAsDataURL(file);
        });

        applySettings();
        renderTasks();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./serviceworker.js').catch((error) => {
                    console.warn('Service worker registration failed:', error);
                });
            });
        }
    </script>
</body>

</html>
